# Self-contained environment. Creates an env named "toxpred" and touches nothing else.
#   conda env create -f environment.yml
#   conda activate toxpred
#   pip install -e .
name: toxpred
channels:
  - conda-forge
dependencies:
  # RDKIT IS PINNED EXACTLY, AND IT HAS TO BE.
  #
  # A floor is not enough. Two rdkit versions that both satisfy >=2025.09 can
  # still disagree: CalcNumHBA, one of the eleven descriptors PharmCast's
  # surrogate reads beside its Morgan bits, differs between 2023.09.6 and
  # 2025.09.x on 7.7 percent of molecules by exactly one. That flips a median of
  # 17 of 10,549 predicted bits and moves cross-family reach for 5.4 percent of
  # compounds, with no error anywhere. Measured 13 October 2026, 869 of 869
  # non-reproducing fingerprints attributed to it.
  #
  # This is the SAME version both services serve, so a figure, the Try it page
  # and this command line cannot disagree because of the interpreter:
  #   toxpred-site/service   rdkit==2025.9.6
  #   reversescreen webapp   rdkit==2025.9.6
  #   the ToxPred study      rdkit=2025.9.6  (Toxicity/environment.yml)
  - python=3.10
  - rdkit=2025.9.6
  - numpy=2.2.6
  - pandas>=2.0
  - requests>=2.31
  - tqdm>=4.66
  # Only the figures need this; scoring and contributing do not.
  - matplotlib>=3.8
  - pip
  - pip:
      - -e .
